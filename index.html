<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行手帖 · Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5efe4;
    --paper-2:#ede4d3;
    --ink:#1c1f2e;
    --ink-soft:#3d4255;
    --muted:#6f6a5e;
    --indigo:#2d4a7c;
    --vermillion:#c1432b;
    --gold:#b88c3a;
    --line:rgba(28,31,46,0.12);
    --shadow: 0 1px 2px rgba(28,31,46,0.04), 0 8px 24px rgba(28,31,46,0.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans TC','Shippori Mincho',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    background-image:
      radial-gradient(circle at 0% 0%, rgba(193,67,43,0.04) 0, transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(45,74,124,0.05) 0, transparent 40%);
    min-height:100vh;
    padding:0 16px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:72px 0 96px}
  .eyebrow{
    font-size:11px;letter-spacing:0.32em;text-transform:uppercase;
    color:var(--vermillion);margin-bottom:18px;
  }
  h1{
    font-family:'Shippori Mincho',serif;
    font-size:clamp(34px,8vw,52px);
    font-weight:800;letter-spacing:0.02em;line-height:1.25;
  }
  h1 .jp{font-family:'Yuji Syuku',serif;font-size:0.5em;color:var(--gold);margin-left:14px;letter-spacing:0.1em}
  .lede{color:var(--ink-soft);font-size:15px;margin:18px 0 48px;max-width:46ch}
  .trip{
    display:block;text-decoration:none;color:inherit;
    background:rgba(255,255,255,0.6);
    border:1px solid var(--line);border-radius:3px;
    padding:26px 24px;margin-bottom:18px;
    box-shadow:var(--shadow);
    transition:transform .18s ease, border-color .18s ease;
  }
  .trip:hover{transform:translateY(-2px);border-color:var(--indigo)}
  .trip-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .trip-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700}
  .tag{
    font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
    padding:3px 9px;border-radius:2px;
    background:var(--paper-2);color:var(--muted);
  }
  .tag.upcoming{background:#dde6cf;color:var(--indigo)}
  .tag.done{background:var(--paper-2);color:var(--muted)}
  .trip-date{font-size:13px;color:var(--vermillion);letter-spacing:0.06em;margin-bottom:10px}
  .trip-note{font-size:14px;color:var(--ink-soft)}
  .foot{
    margin-top:56px;padding-top:22px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);letter-spacing:0.08em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Jed · Family Trips</div>
  <h1>旅行手帖<span class="jp">記録</span></h1>
  <p class="lede">家族旅行的行程表與口袋名單。每一趟各自一頁，手機直接開著走。</p>

  <a class="trip" href="tokyo-2026/">
    <div class="trip-top">
      <span class="trip-title">東京 · 富士山 · 輕井澤</span>
      <span class="tag upcoming">Upcoming</span>
    </div>
    <div class="trip-date">2026.12.25 — 2027.1.1 · 八日七夜</div>
    <div class="trip-note">跨年行。12/26 包車富士山一日遊，12/27-28 輕井澤玩雪，其餘天數東京市區。</div>
  </a>

  <a class="trip" href="fukuoka-2026/">
    <div class="trip-top">
      <span class="trip-title">福岡 · 別府 · 熊本</span>
      <span class="tag done">Completed</span>
    </div>
    <div class="trip-date">2026.9.19 — 9.25 · 七日六夜</div>
    <div class="trip-note">九州自駕親子行。由布院、別府地獄、九州 Safari、阿蘇、熊本城、糸島、太宰府。</div>
  </a>

  <div class="foot">Plan made for Jed</div>
</div>
</body>
</html>
